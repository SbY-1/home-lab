apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    # After the Sealed Secrets controller (-2), before apps that consume Secrets.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/SbY-1/home-lab.git
    targetRevision: main
    path: gitops/secrets
    directory:
      recurse: true
      include: "*.sealedsecret.yaml" # only sealed manifests; ignore README/.example
  destination:
    server: https://kubernetes.default.svc
    namespace: default # fallback only; each SealedSecret sets its own namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
