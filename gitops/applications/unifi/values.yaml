# Device inform (8080/TCP) and STUN (3478/UDP) must be reachable directly by
# UniFi devices. Expose them as LoadBalancer Services that share the
# ingress-nginx IP via Cilium LB-IPAM (same sharing-key, no port overlap).
service:
  comm:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/sharing-key: "ingress"
      lbipam.cilium.io/sharing-cross-namespace: "*"
  stun:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/sharing-key: "ingress"
      lbipam.cilium.io/sharing-cross-namespace: "*"

ingress:
  main:
    enabled: true
    ingressClassName: nginx
    annotations:
      # UniFi only serves HTTPS on 8443 (self-signed); tell nginx to speak TLS upstream
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    targetSelector:
      main: main
    hosts:
      - host: unifi.home
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts: 
        - unifi.home
        secretName: unifi-cert
        