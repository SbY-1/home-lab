# Home Assistant — home automation hub.

# Persistent /config (settings + SQLite history) on the Proxmox CSI StorageClass.
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: proxmox

# Write a sane configuration.yaml on first init, including the http
# trusted_proxies block so HA accepts requests via the ingress (otherwise it
# returns HTTP 400 behind a reverse proxy). forceInit stays false so HA's own
# UI-managed config is never clobbered. The chart's default trusted_proxies
# (10.0.0.0/8, ...) already covers the Talos pod CIDR 10.244.0.0/16.
configuration:
  enabled: true
  forceInit: false

# Exposed via ingress-nginx; external-dns publishes the host to Pi-hole.
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: home-assistant.home
      paths:
        - path: /
          pathType: Prefix

# Install HACS (Home Assistant Community Store) into /config/custom_components
# before HA starts. Idempotent: skips if already present (HACS then self-updates
# from within the UI, so we never overwrite the user's version).
initContainers:
  - name: install-hacs
    image: alpine:3.20
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -f /config/custom_components/hacs/manifest.json ]; then
          echo "HACS already installed"; exit 0
        fi
        apk add --no-cache curl unzip
        mkdir -p /config/custom_components/hacs
        curl -fsSL -o /tmp/hacs.zip \
          https://github.com/hacs/integration/releases/latest/download/hacs.zip
        unzip -o -q /tmp/hacs.zip -d /config/custom_components/hacs
        echo "HACS installed"
    volumeMounts:
      - name: config-volume
        mountPath: /config

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
