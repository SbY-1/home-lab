# Announce LoadBalancer IPs on the LAN via L2 (ARP), replacing MetalLB.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-l2
spec:
  loadBalancerIPs: true
  # Announce on the primary ethernet interface(s) of every node.
  interfaces:
    - ^e.+
  # Announce from all Linux nodes (any node can answer ARP for a LB IP).
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
