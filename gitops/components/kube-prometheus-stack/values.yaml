# kube-prometheus-stack Helm values — tuned for a small homelab cluster.

# --- Prometheus ---
prometheus:
  prometheusSpec:
    # retention: 15d
    # retentionSize: 8GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    # Discover ServiceMonitors/PodMonitors from all namespaces, not just those
    # carrying the release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: proxmox # must match infrastructure storage_class_name
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# --- Alertmanager ---
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: proxmox
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# --- Grafana ---
grafana:
  adminPassword: "" # leave empty -> chart generates a secret; or set via a Secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  # Exposed through ingress-nginx. Point a DNS/hosts entry for this host at the
  # ingress controller's LoadBalancer IP (from the Cilium pool).
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.home
    path: /
  persistence:
    enabled: true
    storageClassName: proxmox
    size: 5Gi

# Talos exposes etcd/scheduler/controller-manager metrics differently than a
# kubeadm cluster. These are enabled; if a target is unreachable on Talos,
# disable the corresponding kube* component below.
# kubeControllerManager:
#   enabled: true
# kubeScheduler:
#   enabled: true
# kubeEtcd:
#   enabled: true
# # kube-proxy is replaced by Cilium, so there is no kube-proxy to scrape.
# kubeProxy:
#   enabled: false
